<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Skills-to-Job Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo" style="width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #6366f1); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1.25rem;">
                SJ
            </div>
            <h2 id="reset-title" style="margin-top: 0.75rem;">Set New Password</h2>
            <p id="reset-subtitle" style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem;">
                Enter your recovery code and choose a new secure password.
            </p>
        </div>

        <form id="form-reset-standalone" onsubmit="handleStandaloneReset(event)">
            <div class="form-group">
                <label class="form-label" for="page-reset-email">Registered Email Address</label>
                <input type="email" id="page-reset-email" class="form-control" placeholder="student@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="page-reset-token">Verification Code / Recovery Token</label>
                <input type="text" id="page-reset-token" class="form-control" placeholder="e.g. 123456 or token" required autocomplete="off">
                <p class="form-hint" style="margin-top: 0.35rem; font-size: 0.8rem; color: var(--text-muted);">
                    Enter the OTP code received during recovery request.
                </p>
            </div>

            <div class="form-group">
                <label class="form-label" for="page-new-password">New Password</label>
                <input type="password" id="page-new-password" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="page-confirm-password">Confirm New Password</label>
                <input type="password" id="page-confirm-password" class="form-control" placeholder="Re-enter new password" minlength="6" required>
            </div>

            <button type="submit" id="btn-page-reset-submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Update Password & Go to Login
            </button>

            <div style="text-align: center; margin-top: 1.25rem;">
                <a href="auth.html" style="font-size: 0.875rem; color: var(--primary); font-weight: 600; text-decoration: none;">
                    &larr; Back to Sign In
                </a>
            </div>
        </form>

        <div id="reset-success-box" style="display: none; text-align: center; padding: 1.5rem 0;">
            <div style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--success);">✓</div>
            <h3 style="margin-bottom: 0.5rem;">Password Updated!</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Your Supabase account password has been successfully updated. Redirecting to sign in...
            </p>
            <a href="auth.html" class="btn btn-primary" style="width: 100%;">
                Sign In Now →
            </a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Read query params if arriving from email recovery link
            const params = new URLSearchParams(window.location.search);
            const emailParam = params.get("email");
            const tokenParam = params.get("token") || params.get("otp");

            if (emailParam) {
                const el = document.getElementById("page-reset-email");
                if (el) el.value = emailParam;
            }
            if (tokenParam) {
                const el = document.getElementById("page-reset-token");
                if (el) el.value = tokenParam;
            }
        });

        async function handleStandaloneReset(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-page-reset-submit");
            const email = document.getElementById("page-reset-email").value.trim().toLowerCase();
            const tokenOrOtp = document.getElementById("page-reset-token").value.trim();
            const newPassword = document.getElementById("page-new-password").value;
            const confirmPassword = document.getElementById("page-confirm-password").value;

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showToast("Please enter a valid registered email address.", "warning");
                return;
            }

            if (!tokenOrOtp) {
                showToast("Please enter the recovery verification code or token.", "warning");
                return;
            }

            if (!newPassword || newPassword.length < 6) {
                showToast("Password must be at least 6 characters long.", "warning");
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast("Passwords do not match. Please re-enter.", "warning");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating password in Supabase...";

            try {
                const res = await API.post("/api/auth/reset-password", {
                    email,
                    token_or_otp: tokenOrOtp,
                    new_password: newPassword
                });

                showToast(res.message || "Password successfully updated!", "success");

                document.getElementById("form-reset-standalone").style.display = "none";
                document.getElementById("reset-success-box").style.display = "block";

                setTimeout(() => {
                    window.location.href = "auth.html";
                }, 1500);

            } catch (err) {
                showToast(err.message || "Failed to update password. Please verify code.", "error");
                btn.disabled = false;
                btn.innerText = "Update Password & Go to Login";
            }
        }
    </script>
</body>
</html>
